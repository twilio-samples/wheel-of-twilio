name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          ID_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$ID_TOKEN" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Write deploy env file
        env:
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          VERIFY_SERVICE_SID: ${{ vars.VERIFY_SERVICE_SID }}
          SYNC_SERVICE_SID: ${{ vars.SYNC_SERVICE_SID }}
          MESSAGING_SERVICE_SID: ${{ vars.MESSAGING_SERVICE_SID }}
          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          NEXT_PUBLIC_WEDGES: ${{ vars.NEXT_PUBLIC_WEDGES }}
          NEXT_PUBLIC_TWILIO_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_TWILIO_PHONE_NUMBER }}
          EVENT_NAME: ${{ vars.EVENT_NAME }}
          LEAD_COLLECTION: ${{ vars.LEAD_COLLECTION }}
          OFFERED_PRIZES: ${{ vars.OFFERED_PRIZES }}
          SMALL_PRIZES: ${{ vars.SMALL_PRIZES }}
          TWILIO_CONVERSATION_CONFIGURATION_ID: ${{ vars.TWILIO_CONVERSATION_CONFIGURATION_ID }}
          TWILIO_MEMORY_STORE_ID: ${{ vars.TWILIO_MEMORY_STORE_ID }}
          SEGMENT_SPACE_ID: ${{ secrets.SEGMENT_SPACE_ID }}
          SEGMENT_PROFILE_KEY: ${{ secrets.SEGMENT_PROFILE_KEY }}
          SEGMENT_TRAIT_CHECK: ${{ vars.SEGMENT_TRAIT_CHECK }}
        run: |
          write_var() {
            printf '%s=%q\n' "$1" "${!1}"
          }
          {
            write_var TWILIO_ACCOUNT_SID
            write_var TWILIO_API_KEY
            write_var TWILIO_API_SECRET
            write_var TWILIO_AUTH_TOKEN
            write_var VERIFY_SERVICE_SID
            write_var SYNC_SERVICE_SID
            write_var MESSAGING_SERVICE_SID
            write_var BASIC_AUTH_USERNAME
            write_var BASIC_AUTH_PASSWORD
            write_var NEXT_PUBLIC_WEDGES
            write_var NEXT_PUBLIC_TWILIO_PHONE_NUMBER
            write_var EVENT_NAME
            write_var LEAD_COLLECTION
            write_var OFFERED_PRIZES
            write_var SMALL_PRIZES
            write_var TWILIO_CONVERSATION_CONFIGURATION_ID
            write_var TWILIO_MEMORY_STORE_ID
            write_var SEGMENT_SPACE_ID
            write_var SEGMENT_PROFILE_KEY
            write_var SEGMENT_TRAIT_CHECK
          } > .env.local

      - name: Deploy
        run: ./deploy.sh
